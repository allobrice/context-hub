<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Hub</title>
    <meta name="description" content="Context Hub : contextes Markdown versionnés et partagés, lus par les sessions Claude Code via MCP." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applique le thème avant le premier rendu (pas de flash). Même clé que ThemeProvider.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('context-hub:theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
