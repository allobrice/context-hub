name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR : un nouveau push annule le run obsolète. main : chaque commit garde son statut.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  checks:
    name: Format, lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Version de pnpm lue dans `packageManager` (package.json racine).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      # Le `build` de chaque paquet enchaîne son `typecheck` : on lance le typecheck des paquets
      # sans build, puis les builds.
      - run: pnpm --filter "!@context-hub/web" -r typecheck
      - run: pnpm -r build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Version de pnpm lue dans `packageManager` (package.json racine).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
