packages:
  - apps/*
  - packages/*
# Un paquet à la fois pour `pnpm -r` : chaque Vitest dispose de tous les cœurs (trois suites en
# parallèle sursouscrivaient le CPU et rendaient instables les tests d'UI du front).
workspaceConcurrency: 1
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.3'
  - '@tanstack/query-devtools@5.108.3'
  - '@tanstack/react-query-devtools@5.108.3'
  - '@tanstack/react-query@5.108.3'
  - hono@4.13.21
